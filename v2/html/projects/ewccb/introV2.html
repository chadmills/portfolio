<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    CDM BUILD INTRO
    Version: 2.1.0
    Updated: 2026-09-07

    CHANGELOG
    v2.1.0
    - Added LinkedIn profile image -> HeyGen build.mp4 transition.
    - Added sound-on autoplay attempt.
    - Added MUTE / SOUND ON toggle.
    - Added PLAY INTRO fallback when audible autoplay is blocked.
    - Preserved START HERE destination:
      https://chadmills.github.io/portfolio/v2/html/projects/ewccb/experience.html
    - Added cache-prevention directives.
    - Added cache-busting version query to build.mp4.
  -->

  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Experience What Chad Can Build</title>
  <link rel="shortcut icon" href="https://chadmills.github.io/portfolio/v2/html/img/cdm.ico">

  <style>
    :root {
      --yellow: #f6c21a;
      --ink: #1d1d1f;
      --soft: #8c8c8c;
      --white: #ffffff;
      --espresso: #241913;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--white);
      color: var(--ink);
      overflow: hidden;
    }

    .stage {
      width: 100vw;
      height: 100vh;
      background: var(--white);
      display: grid;
      place-items: center;
      position: relative;
    }

    /* ----------------------------
       INTRO LOGO
    ----------------------------- */
    .logo-wrap {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      animation:
        logoEnter 900ms cubic-bezier(.18,.95,.22,1.16) 120ms both,
        logoPulse 520ms ease-in-out 1120ms both,
        logoExit 760ms cubic-bezier(.77,0,.18,1) 2100ms forwards;
      will-change: transform, opacity;
    }

    .cdm-logo {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: var(--yellow);
      border: 12px solid #4b4640;
      color: #111111;
      display: grid;
      place-items: center;
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.13);
      position: relative;
    }

    .logo-inner {
      text-align: center;
      transform: translateY(2px);
      line-height: 1;
    }

    .logo-cdm {
      font-size: 56px;
      font-weight: 900;
      letter-spacing: -4px;
      line-height: 0.92;
    }

    .logo-sub {
      margin-top: 7px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    @keyframes logoEnter {
      0% {
        opacity: 0;
        transform: translateY(42px) scale(0.34) rotate(-7deg);
      }
      68% {
        opacity: 1;
        transform: translateY(-8px) scale(1.11) rotate(1deg);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0);
      }
    }

    @keyframes logoPulse {
      0% { transform: scale(1); }
      45% { transform: scale(1.075); }
      100% { transform: scale(1); }
    }

    @keyframes logoExit {
      0% {
        opacity: 1;
        transform: translateX(0) translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateX(120vw) translateY(-18vh) scale(0.72) rotate(12deg);
      }
    }

    /* ----------------------------
       MESSAGE
    ----------------------------- */
    .message {
      text-align: center;
      opacity: 0;
      animation: messageIn 120ms linear 3020ms forwards;
      padding: 0 24px;
    }

    @keyframes messageIn {
      to { opacity: 1; }
    }

    .type-line {
      min-height: 54px;
      font-size: clamp(2rem, 5vw, 4.2rem);
      font-weight: 800;
      letter-spacing: -0.055em;
      line-height: 1.05;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .cursor {
      display: inline-block;
      width: 4px;
      height: 0.88em;
      margin-left: 8px;
      background: var(--ink);
      animation: blink 780ms steps(1) infinite;
      transform: translateY(4px);
    }

    @keyframes blink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }

    /* ----------------------------
       LINKEDIN STILL -> HEYGEN VIDEO
    ----------------------------- */
    .intro-video {
      opacity: 0;
      transform: translateY(12px) scale(.95);
      margin-top: 26px;
      margin-bottom: 20px;
      animation: portraitIn 620ms cubic-bezier(.2,.8,.2,1) 5600ms forwards;
      display: flex;
      justify-content: center;
    }

    .portrait-shell {
      width: 156px;
      height: 156px;
      border-radius: 50%;
      position: relative;
      display: grid;
      place-items: center;
    }

    .portrait-shell::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid rgba(246, 194, 26, .72);
      box-shadow: 0 0 0 7px rgba(246, 194, 26, .07);
      animation: orbitPulse 2.6s ease-in-out infinite;
    }

    .portrait-mask {
      width: 156px;
      height: 156px;
      border-radius: 50%;
      overflow: hidden;
      border: 5px solid #fff;
      box-shadow:
        0 0 0 1px rgba(29, 29, 31, .16),
        0 16px 36px rgba(0, 0, 0, .16);
      background: #eee;
      position: relative;
      z-index: 1;
      isolation: isolate;
    }

    .still-layer,
    .video-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition:
        opacity 700ms ease,
        transform 700ms cubic-bezier(.2,.8,.2,1),
        filter 700ms ease;
    }

    .still-layer {
      opacity: 1;
      transform: scale(1);
      z-index: 2;
    }

    .video-layer {
      opacity: 0;
      transform: scale(1.06);
      z-index: 1;
      background: #111;
    }

    .portrait-mask.is-playing .still-layer {
      opacity: 0;
      transform: scale(1.06);
      filter: blur(2px);
    }

    .portrait-mask.is-playing .video-layer {
      opacity: 1;
      transform: scale(1);
    }

    .sound-toggle {
      position: absolute;
      right: -26px;
      bottom: 2px;
      z-index: 5;
      min-width: 42px;
      height: 42px;
      padding: 0 11px;
      border: 3px solid #fff;
      border-radius: 999px;
      background: var(--yellow);
      color: #111;
      font: inherit;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .08em;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,.14);
      opacity: 0;
      transform: scale(.9);
      pointer-events: none;
      transition: opacity 260ms ease, transform 260ms ease;
    }

    .sound-toggle.is-visible {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    @keyframes portraitIn {
      0% {
        opacity: 0;
        transform: translateY(12px) scale(.95);
      }
      72% {
        opacity: 1;
        transform: translateY(-2px) scale(1.02);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes orbitPulse {
      0%, 100% {
        transform: scale(1);
        opacity: .85;
      }
      50% {
        transform: scale(1.035);
        opacity: .45;
      }
    }

    /* ----------------------------
       CTA + SUPPORTING COPY
    ----------------------------- */
    .coming-soon {
      opacity: 0;
      transform: translateY(18px);
      margin-top: 0;
      animation: buttonIn 520ms ease 7000ms forwards;
    }

    @keyframes buttonIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .btn {
      border: 0;
      border-radius: 999px;
      background: var(--yellow);
      color: #111111;
      font-size: 0.96rem;
      font-weight: 900;
      letter-spacing: 0.16em;
      padding: 16px 30px;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(246, 194, 26, 0.32);
      animation: buttonPulse 1.85s ease-in-out 7600ms infinite;
    }

    .btn:active {
      transform: scale(0.98);
    }

    @keyframes buttonPulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(246, 194, 26, 0.42);
      }
      55% {
        transform: scale(1.035);
        box-shadow: 0 0 0 16px rgba(246, 194, 26, 0);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(246, 194, 26, 0);
      }
    }

    .promise {
      opacity: 0;
      margin-top: 24px;
      color: var(--soft);
      font-size: 0.92rem;
      line-height: 1.65;
      animation: promiseIn 620ms ease 7600ms forwards;
    }

    @keyframes promiseIn {
      to { opacity: 1; }
    }

    .version {
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 10px;
      color: #a8a8a8;
    }

    /* ----------------------------
       EXIT TRANSITION
    ----------------------------- */
    .transition-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
    }

    .transition-circle {
      position: absolute;
      left: var(--x, 50%);
      top: var(--y, 50%);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--yellow);
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
    }

    .transition-panel {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 12%, rgba(246, 194, 26, 0.18), transparent 28%),
        linear-gradient(145deg, #2b211b 0%, #1c130f 100%);
      opacity: 0;
      transform: scale(1.04);
      display: grid;
      place-items: center;
      color: #f6ead8;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.82rem;
    }

    .stage.is-transitioning .message {
      animation: none;
      opacity: 1;
      transform: translateY(-12px);
      transition: opacity 300ms ease, transform 300ms ease;
    }

    .stage.is-transitioning .transition-circle {
      animation: circleWipe 720ms cubic-bezier(.76,0,.24,1) forwards;
    }

    .stage.is-transitioning .transition-panel {
      animation: panelIn 520ms ease 380ms forwards;
    }

    @keyframes circleWipe {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(95);
      }
    }

    @keyframes panelIn {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 560px) {
      .cdm-logo {
        width: 158px;
        height: 158px;
        border-width: 10px;
      }

      .logo-cdm {
        font-size: 47px;
      }

      .logo-sub {
        font-size: 17px;
      }

      .type-line {
        min-height: 96px;
      }

      .portrait-shell,
      .portrait-mask {
        width: 128px;
        height: 128px;
      }

      .sound-toggle {
        right: -34px;
        height: 38px;
        min-width: 38px;
        font-size: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-delay: 0ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>

  <script
    async
    type="text/javascript"
    src="https://static.klaviyo.com/onsite/js/klaviyo.js?company_id=SR8TU9">
  </script>
</head>

<body>
  <main class="stage" id="stage" aria-label="CDM UX+E Intro">

    <section class="logo-wrap" aria-label="CDM UX+E logo animation">
      <div class="cdm-logo">
        <div class="logo-inner">
          <div class="logo-cdm">CDM</div>
          <div class="logo-sub">UX + E</div>
        </div>
      </div>
    </section>

    <section class="message" aria-label="Intro message">

      <div class="type-line">
        <span id="typed"></span><span class="cursor" aria-hidden="true"></span>
      </div>

      <div class="intro-video" aria-label="Chad Mills introduction">
        <div class="portrait-shell">

          <div class="portrait-mask" id="portraitMask">

            <img
              class="still-layer"
              src="https://media.licdn.com/dms/image/v2/D5603AQGxjgkK0fybxQ/profile-displayphoto-shrink_800_800/B56ZY5KEmaH0Ac-/0/1744715664249?e=1790208000&v=beta&t=MDFcq9GFpb5RKglthyJu6b4ba7dpnm4Vj4xrWEMQPKA"
              alt="Chad Mills"
            />

            <video
              class="video-layer"
              id="buildVideo"
              playsinline
              preload="auto"
            >
              <source src="build.mp4?v=2.1.0" type="video/mp4">
            </video>

          </div>

          <button
            class="sound-toggle"
            id="soundToggle"
            type="button"
            aria-label="Turn video sound on">
            SOUND
          </button>

        </div>
      </div>

      <div class="coming-soon">
        <button class="btn" id="startBtn" type="button">START HERE</button>
      </div>

      <div class="promise">
        <div class="version">Version 2.0</div>
        <div>The portfolio ends here.</div>
        <div>The experience begins now.</div>
      </div>

    </section>

    <div class="transition-layer" aria-hidden="true">
      <div class="transition-circle" id="transitionCircle"></div>
      <div class="transition-panel">Loading experience...</div>
    </div>

  </main>

  <script>
    const typed = document.getElementById("typed");
    const baseText = "Experience what Chad can build";
    const startDelay = 3220;
    const typeSpeed = 58;
    const dotDelay = 360;

    const stage = document.getElementById("stage");
    const startBtn = document.getElementById("startBtn");
    const transitionCircle = document.getElementById("transitionCircle");

    const portraitMask = document.getElementById("portraitMask");
    const buildVideo = document.getElementById("buildVideo");
    const soundToggle = document.getElementById("soundToggle");

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function typeIntro() {
      await sleep(startDelay);

      for (let i = 0; i <= baseText.length; i++) {
        typed.textContent = baseText.slice(0, i);
        await sleep(typeSpeed);
      }

      await sleep(260);
      typed.textContent = baseText + ".";
      await sleep(dotDelay);
      typed.textContent = baseText + "..";
      await sleep(dotDelay);
      typed.textContent = baseText + "...";
    }

    typeIntro();

    async function startBuildVideo() {
      /*
        Primary behavior: autoplay WITH sound.
        If the browser blocks audible autoplay, keep the LinkedIn
        still visible and expose a PLAY INTRO control.
      */

      try {
        buildVideo.muted = false;
        buildVideo.volume = 1;

        await buildVideo.play();

        portraitMask.classList.add("is-playing");
        soundToggle.textContent = "MUTE";
        soundToggle.setAttribute("aria-label", "Mute video");
        soundToggle.classList.add("is-visible");
      } catch (error) {
        console.warn("Sound-on autoplay was blocked.", error);

        soundToggle.textContent = "PLAY INTRO";
        soundToggle.setAttribute("aria-label", "Play intro with sound");
        soundToggle.classList.add("is-visible");
      }
    }

    /*
      The LinkedIn image fades in with the portrait at ~5.6s.
      Give the still image roughly one second on screen before video begins.
    */
    setTimeout(startBuildVideo, 6600);

    soundToggle.addEventListener("click", async function() {
      try {
        if (buildVideo.paused) {
          buildVideo.muted = false;
          buildVideo.volume = 1;

          await buildVideo.play();

          portraitMask.classList.add("is-playing");
          soundToggle.textContent = "MUTE";
          soundToggle.setAttribute("aria-label", "Mute video");
          return;
        }

        buildVideo.muted = !buildVideo.muted;

        if (buildVideo.muted) {
          soundToggle.textContent = "SOUND ON";
          soundToggle.setAttribute("aria-label", "Turn video sound on");
        } else {
          buildVideo.volume = 1;
          soundToggle.textContent = "MUTE";
          soundToggle.setAttribute("aria-label", "Mute video");
        }
      } catch (error) {
        console.warn("Unable to control video playback.", error);
      }
    });

    /*
      When the clip finishes, leave the last video frame in the circle.
      If you prefer to return to the LinkedIn still instead, uncomment:
      portraitMask.classList.remove("is-playing");
    */
    buildVideo.addEventListener("ended", function() {
      soundToggle.classList.remove("is-visible");
    });

    startBtn.addEventListener("click", function() {
      const rect = startBtn.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;

      transitionCircle.style.setProperty("--x", x + "px");
      transitionCircle.style.setProperty("--y", y + "px");

      stage.classList.add("is-transitioning");

      setTimeout(function() {
        window.location.href = "https://chadmills.github.io/portfolio/v2/html/projects/ewccb/experience.html";
      }, 1050);
    });
  </script>

</body>
</html>
